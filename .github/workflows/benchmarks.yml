
name: Benchmarks

permissions:
  contents: read
  pull-requests: write

on:
  workflow_dispatch:
    inputs:
      project:
        description: "Benchmark project name (empty = all)"
        required: false
        default: ""
        type: string

      filter:
        description: "Benchmark filter"
        required: false
        default: "*"
        type: string

  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - labeled

jobs:
  benchmark:
    if: >-
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'run-benchmarks')

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Run benchmarks
        shell: bash
        env:
          PROJECT: ${{ inputs.project || '' }}
          FILTER: ${{ inputs.filter || '*' }}
        run: |
          if [ -z "$PROJECT" ]; then
            mapfile -t projects < <(
              find benchmarks -name "*.csproj" \
                ! -name "CachedEfCore.Benchmarks.Common.csproj"
            )
          else
            mapfile -t projects < <(
              find benchmarks -name "$PROJECT.csproj"
            )
          fi

          if [ ${#projects[@]} -eq 0 ]; then
            echo "No benchmark projects found."

            if [ -n "$PROJECT" ]; then
              echo "Project: $PROJECT"
            fi

            exit 1
          fi

          echo "Projects to benchmark:"
          printf '  %s\n' "${projects[@]}"

          for project in "${projects[@]}"; do
            echo
            echo "========================================"
            echo "Running: $project"
            echo "========================================"

            dotnet run \
              --project "$project" \
              --configuration Release \
              -- \
              --filter "$FILTER"
          done

      - name: Generate benchmark report
        if: success()
        shell: bash
        run: |
          REPORT="$RUNNER_TEMP/benchmark-comment.md"

          echo "<!-- benchmark-results -->" > "$REPORT"
          echo "## Benchmark results" >> "$REPORT"
          echo "" >> "$REPORT"

          if [ -d "BenchmarkDotNet.Artifacts/results" ]; then
            find BenchmarkDotNet.Artifacts/results \
              -name "*.md" -type f | sort | while read -r file; do

              echo "### $(basename "$file" .md)" >> "$REPORT"
              echo "" >> "$REPORT"
              cat "$file" >> "$REPORT"
              echo "" >> "$REPORT"
              echo "---" >> "$REPORT"
              echo "" >> "$REPORT"
            done
          fi

          if [ "$(wc -c < "$REPORT")" -lt 100 ]; then
            echo "No Markdown benchmark reports were generated." >> "$REPORT"
          fi

          echo "" >> "$REPORT"
          echo "[View workflow run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)" >> "$REPORT"

          cat "$REPORT" >> "$GITHUB_STEP_SUMMARY"

      - name: Comment benchmark results on PR
        if: >-
          success() &&
          github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          REPORT_PATH: ${{ runner.temp }}/benchmark-comment.md
        with:
          script: |
            const fs = require('fs');

            const marker = '<!-- benchmark-results -->';
            const body = fs.readFileSync(
              process.env.REPORT_PATH,
              'utf8'
            );

            const issue_number = context.issue.number;

            const comments = await github.paginate(
              github.rest.issues.listComments,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number
              }
            );

            const existingComment = comments.find(comment =>
              comment.user.type === 'Bot' &&
              comment.body.includes(marker)
            );

            if (existingComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingComment.id,
                body
              });

              core.info('Updated existing benchmark comment.');
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number,
                body
              });

              core.info('Created benchmark comment.');
            }

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: BenchmarkDotNet.Artifacts/**
          if-no-files-found: warn
